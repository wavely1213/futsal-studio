<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>썸네일 · 풋살사관학교 스튜디오</title>
<style>
  :root { --bg:#161616; --panel:#1f1f1f; --panel-2:#262626; --panel-3:#2e2e2e; --line:#0c0c0c; --line-2:#383838; --ink:#e8e8e8; --ink-2:#a3a3a3; --ink-3:#6b6b6b; --accent:#2d8ceb; --accent-soft:rgba(45,140,235,.18); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 12.5px/1.45 "Pretendard Black", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-weight: 500; overflow: hidden; -webkit-user-select: none; user-select: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  input[type=range] { accent-color: var(--accent); width: 100%; }
  .app { display: grid; height: 100vh; grid-template-columns: 48px 1fr 330px; grid-template-rows: 40px 1fr 132px; gap: 2px; background: var(--line); }
  .panel { background: var(--panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .top { grid-column: 1 / -1; background: #1b1b1b; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
  .top .logo { width: 24px; height: 24px; border-radius: 6px; background: #0f7a3d; color: #fff; font-weight: 900; font-size: 10px; display: grid; place-items: center; }
  .top .name { font-weight: 700; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { color: var(--ink-3); font-size: 11.5px; }
  .sp { flex: 1; }
  .btn { border: 1px solid var(--line-2); background: var(--panel-3); border-radius: 5px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #3a3a3a; } .btn:disabled { opacity: .4; cursor: default; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .ic { border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 4px 6px; border-radius: 4px; }
  .ic:hover { background: var(--panel-3); color: var(--ink); } .ic.on { color: var(--accent); background: var(--accent-soft); }
  .tools { grid-row: 2 / 4; align-items: center; padding: 8px 0; gap: 4px; }
  .tools .ic { width: 34px; height: 34px; font-size: 15px; }
  .tools hr { width: 26px; border: 0; border-top: 1px solid var(--line-2); margin: 4px 0; }
  .stage { position: relative; display: grid; place-items: center; background: #0e0e0e; overflow: hidden; }
  .wrap { position: relative; box-shadow: 0 0 0 1px #333, 0 8px 30px rgba(0,0,0,.5); }
  #cv { display: block; }
  #ui { position: absolute; inset: 0; }
  .selbox { position: absolute; border: 1px solid #2d8ceb; pointer-events: none; transform-origin: 50% 50%; }
  .selbox .h { position: absolute; width: 10px; height: 10px; background: #fff; border: 1px solid #2d8ceb; pointer-events: auto; }
  .selbox .h.nw { left: -6px; top: -6px; cursor: nwse-resize; } .selbox .h.ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .selbox .h.sw { left: -6px; bottom: -6px; cursor: nesw-resize; } .selbox .h.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .selbox .h.rot { left: 50%; top: -30px; margin-left: -6px; border-radius: 50%; cursor: grab; }
  .selbox .h.rot::after { content: ""; position: absolute; left: 4px; top: 10px; width: 1px; height: 18px; background: #2d8ceb; }
  .guide { position: absolute; background: #ff3ea5; pointer-events: none; display: none; }
  .guide.v { width: 1px; top: 0; bottom: 0; } .guide.h { height: 1px; left: 0; right: 0; }
  .brushcur { position: absolute; border: 1px solid #fff; border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 1px #000; display: none; }
  .ph { display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 6px; border-bottom: 1px solid var(--line); flex: none; }
  .ph .tab { border: 0; background: none; padding: 5px 10px; color: var(--ink-2); cursor: pointer; border-radius: 4px; font-weight: 600; }
  .ph .tab.on { color: var(--ink); background: var(--panel-3); }
  .ph .t { font-weight: 700; padding: 0 6px; color: var(--ink-2); }
  .body { flex: 1; overflow: auto; min-height: 0; }
  .right { grid-column: 3; grid-row: 2 / 4; display: grid; grid-template-rows: 1fr 250px; gap: 2px; background: var(--line); }
  .pg { border-bottom: 1px solid var(--line); padding: 10px 12px 12px; }
  .pg h4 { margin: 0 0 10px; font-size: 12px; }
  .f { display: grid; grid-template-columns: 78px 1fr auto; gap: 8px; align-items: center; margin-bottom: 7px; }
  .f label { color: var(--ink-2); } .f .v { color: var(--ink-2); min-width: 40px; text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .f input[type=color] { width: 30px; height: 22px; border: 1px solid var(--line-2); background: none; padding: 0; border-radius: 4px; }
  .s { width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 4px 6px; -webkit-user-select: text; user-select: text; }
  textarea.s { resize: vertical; min-height: 58px; }
  .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
  .seg button.on { background: var(--panel-3); color: var(--ink); }
  .row2 { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .layers .ly { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid #191919; cursor: pointer; }
  .layers .ly.sel { background: var(--accent-soft); }
  .layers .ly .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layers .ly .ty { width: 18px; text-align: center; color: var(--ink-3); }
  .film { grid-column: 2; display: flex; flex-direction: column; }
  .film .strip { display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; flex: 1; align-items: center; }
  .film .fr { flex: none; height: 76px; aspect-ratio: 16/9; border-radius: 4px; overflow: hidden; cursor: pointer; border: 2px solid transparent; position: relative; background: #222; }
  .film .fr img { width: 100%; height: 100%; object-fit: cover; }
  .film .fr:hover { border-color: var(--accent); }
  .film .fr span { position: absolute; right: 3px; bottom: 2px; font-size: 10px; background: rgba(0,0,0,.7); padding: 0 4px; border-radius: 3px; }
  .cands { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
  .cand { cursor: pointer; border-radius: 6px; overflow: hidden; border: 2px solid transparent; background: #000; }
  .cand:hover { border-color: var(--accent); }
  .cand canvas { display: block; width: 100%; }
  .cand div { font-size: 11px; padding: 3px 6px; background: var(--panel-2); color: var(--ink-2); }
  .designs { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .designs .d { flex: none; width: 96px; cursor: pointer; border: 2px solid transparent; border-radius: 4px; overflow: hidden; }
  .designs .d.cur { border-color: var(--accent); }
  .designs .d canvas { display: block; width: 100%; }
  .pill { display: none; align-items: center; gap: 8px; background: var(--panel-3); border: 1px solid var(--line-2); padding: 4px 10px; border-radius: 999px; font-size: 12px; }
  .pill.show { display: inline-flex; }
  .pill .bar { width: 90px; height: 5px; background: #111; border-radius: 3px; overflow: hidden; }
  .pill .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(16px); background: #fff; color: #111; padding: 9px 16px; border-radius: 8px; font-weight: 700; opacity: 0; transition: .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="btn" id="back">← 스튜디오</button>
    <div class="logo">FS</div>
    <div class="name" id="pname">썸네일</div>
    <span class="hint" id="saved"></span>
    <div class="sp"></div>
    <button class="ic" id="undo" title="되돌리기 (Ctrl+Z)">↶</button>
    <button class="ic" id="redo" title="다시 실행 (Ctrl+Shift+Z)">↷</button>
    <span class="pill" id="busy"><span id="busyTxt">작업 중</span><span class="bar"><i id="busyBar"></i></span></span>
    <select class="s" id="exFmt" style="width:auto"><option value="jpg">JPG (유튜브용)</option><option value="png">PNG</option></select>
    <button class="btn pri" id="exportBtn">이미지로 저장</button>
  </div>

  <div class="panel tools">
    <button class="ic on" id="tMove" title="이동·선택 (V)">➤</button>
    <button class="ic" id="tText" title="글자 추가 (T)">T</button>
    <button class="ic" id="tRect" title="사각형 (U)">▭</button>
    <button class="ic" id="tEllipse" title="원">◯</button>
    <button class="ic" id="tSlant" title="사선 패널">▱</button>
    <button class="ic" id="tBurst" title="집중선">✳</button>
    <hr>
    <button class="ic" id="tImage" title="이미지 파일 불러오기">🖼</button>
    <button class="ic" id="tCut" title="누끼 따기 (선택한 이미지)">✂</button>
    <button class="ic" id="tBrush" title="누끼 다듬기 브러시 (B)">🖌</button>
    <input type="file" id="fileIn" accept="image/*" style="display:none">
  </div>

  <div class="stage" id="stage">
    <div class="wrap" id="wrap"><canvas id="cv"></canvas><div id="ui"><div class="guide v" id="gv"></div><div class="guide h" id="gh"></div><div class="brushcur" id="bcur"></div></div></div>
  </div>

  <div class="right">
    <div class="panel">
      <div class="ph"><button class="tab on" data-tab="auto">자동 제작</button><button class="tab" data-tab="props">속성</button><div class="sp"></div></div>
      <div class="body" id="tab-auto"></div>
      <div class="body" id="tab-props" style="display:none"></div>
    </div>
    <div class="panel layers">
      <div class="ph"><span class="t">레이어</span><div class="sp"></div>
        <button class="ic" id="lUp" title="위로 (])">▲</button><button class="ic" id="lDown" title="아래로 ([)">▼</button>
        <button class="ic" id="lDup" title="복제 (Ctrl+D)">⧉</button><button class="ic" id="lDel" title="삭제 (Delete)">🗑</button></div>
      <div class="body" id="layers"></div>
    </div>
  </div>

  <div class="panel film">
    <div class="ph"><span class="t">영상 장면</span><span class="hint">누르면 배경으로 · Shift+누르면 이미지 레이어로 추가</span><div class="sp"></div>
      <span class="hint" id="scrubT">00:00</span><input type="range" id="scrub" min="0" max="1" step="0.001" value="0.3" style="width:220px"><button class="btn" id="grabBtn">이 장면 추가</button></div>
    <div class="strip" id="strip"><span class="hint" style="padding:10px">장면을 고르는 중…</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NAME = new URLSearchParams(location.search).get("name");
const W = 1280, H = 720;
const nid = () => Math.random().toString(16).slice(2, 10);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const niceName = n => n.replace(/^\d{8}_[A-Za-z0-9_-]{11}_/, "").replace(/\.[^.]+$/, "");
const mmss = t => `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const FONTS = { "검은고딕": "Black Han Sans", "프리텐다드 블랙": "Pretendard Black", "프리텐다드 볼드": "Pretendard Bold", "도현": "Do Hyeon" };
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }
async function post(url, body) { const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); return r.json(); }

let DOCS = { designs: [] }, cur = 0, D = null, sel = null, tool = "move", brush = { mode: "erase", size: 40 };
let FRAMES = [], HOOKS = [], KEYWORDS = [], INFO = { duration: 60 };
let undoStack = [], redoStack = [], saveTimer = null, scale = 0.6;

/* ---------- 이미지 캐시 ---------- */
const IMG = {};
function img(src) {
  if (!src) return null;
  if (IMG[src]) return IMG[src].complete && IMG[src].naturalWidth ? IMG[src] : null;
  const im = new Image(); im.crossOrigin = "anonymous"; im.onload = () => { renderAll(); }; im.src = src; IMG[src] = im; return null;
}

/* ---------- 레이어 기본값 ---------- */
function L(type, o) {
  const base = { id: nid(), type, name: "", x: 0, y: 0, w: 300, h: 200, rot: 0, opacity: 1, hidden: false, locked: false };
  const defs = {
    image: { name: "이미지", src: "", fit: "cover", fx: 0.5, fy: 0.5, flipX: false, bright: 100, contrast: 100, sat: 100, blur: 0, slant: 0, outline: { on: false, color: "#FFFFFF", width: 10 }, shadow: { on: false, color: "#000000", blur: 20, dx: 0, dy: 8 } },
    text: { name: "글자", text: "제목을 입력", font: "Black Han Sans", size: 110, fill: "#FFFFFF", align: "left", lh: 1.12, ls: 0, skew: 0,
      strokes: [{ color: "#000000", width: 16 }, { color: "#FFFFFF", width: 0 }], shadow: { on: true, color: "#000000", blur: 0, dx: 8, dy: 8 },
      box: { on: false, color: "#1F5FE0", pad: 18, radius: 0 } },
    shape: { name: "도형", shape: "rect", fill: "#000000", fill2: "", gradAngle: 90, radius: 0, slant: 0, stroke: { color: "#FFFFFF", width: 0 }, lines: 60, inner: 0.35 },
  };
  return Object.assign(base, JSON.parse(JSON.stringify(defs[type])), o || {});
}

/* ---------- 그리기 ---------- */
function textLines(l) { return String(l.text).split("\n"); }
function textMetrics(ctx, l) {
  ctx.font = `${l.size}px "${l.font}"`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = `${l.ls}px`;
  const lines = textLines(l), lh = l.size * l.lh;
  const ws = lines.map(t => ctx.measureText(t).width);
  return { lines, lh, ws, w: Math.max(1, ...ws), h: lh * lines.length };
}
function fitText(l, ctx) { const m = textMetrics(ctx, l); const pad = (l.box.on ? l.box.pad : 0) + Math.max(0, ...l.strokes.map(s => s.width)) / 2; l.w = m.w + pad * 2; l.h = m.h + pad * 2; }
function rrect(ctx, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function slantPath(ctx, w, h, s) { const o = s * h; ctx.beginPath(); ctx.moveTo(o > 0 ? o : 0, 0); ctx.lineTo(w + (o < 0 ? o : 0), 0); ctx.lineTo(w - (o > 0 ? o : 0), h); ctx.lineTo(o < 0 ? -o : 0, h); ctx.closePath(); }
const outlineCache = {};
function silhouette(im, w, h, color) {
  const k = im.src + w + "x" + h + color;
  if (outlineCache[k]) return outlineCache[k];
  const c = document.createElement("canvas"); c.width = Math.ceil(w); c.height = Math.ceil(h);
  const g = c.getContext("2d"); g.drawImage(im, 0, 0, w, h); g.globalCompositeOperation = "source-in"; g.fillStyle = color; g.fillRect(0, 0, w, h);
  return (outlineCache[k] = c);
}
function drawLayer(ctx, l) {
  if (l.hidden) return;
  ctx.save();
  ctx.globalAlpha = l.opacity;
  ctx.translate(l.x + l.w / 2, l.y + l.h / 2); ctx.rotate(l.rot * Math.PI / 180); ctx.translate(-l.w / 2, -l.h / 2);
  if (l.type === "image") {
    const im = img(l.src);
    if (im) {
      if (l.slant) { slantPath(ctx, l.w, l.h, l.slant); ctx.clip(); }
      if (l.flipX) { ctx.translate(l.w, 0); ctx.scale(-1, 1); }
      let dw, dh;
      const ar = im.naturalWidth / im.naturalHeight;
      if (l.fit === "cover") { if (l.w / l.h > ar) { dw = l.w; dh = l.w / ar; } else { dh = l.h; dw = l.h * ar; } }
      else { if (l.w / l.h > ar) { dh = l.h; dw = l.h * ar; } else { dw = l.w; dh = l.w / ar; } }
      const dx = (l.w - dw) * l.fx, dy = (l.h - dh) * l.fy;
      if (l.shadow.on) { ctx.shadowColor = l.shadow.color; ctx.shadowBlur = l.shadow.blur; ctx.shadowOffsetX = l.shadow.dx; ctx.shadowOffsetY = l.shadow.dy; }
      if (l.outline.on && l.outline.width > 0) {
        const sil = silhouette(im, dw, dh, l.outline.color), r = l.outline.width;
        for (let a = 0; a < 24; a++) { const t = a / 24 * Math.PI * 2; ctx.drawImage(sil, dx + Math.cos(t) * r, dy + Math.sin(t) * r, dw, dh); }
        ctx.shadowColor = "transparent";
      }
      const f = `brightness(${l.bright}%) contrast(${l.contrast}%) saturate(${l.sat}%)${l.blur ? ` blur(${l.blur}px)` : ""}`;
      if (f !== "brightness(100%) contrast(100%) saturate(100%)") ctx.filter = f;
      ctx.drawImage(l._edit || im, dx, dy, dw, dh);
      ctx.filter = "none";
    } else { ctx.fillStyle = "#333"; ctx.fillRect(0, 0, l.w, l.h); }
  } else if (l.type === "shape") {
    let fill = l.fill;
    if (l.fill2) {
      const a = l.gradAngle * Math.PI / 180, cx = l.w / 2, cy = l.h / 2, r = Math.abs(Math.cos(a)) * l.w / 2 + Math.abs(Math.sin(a)) * l.h / 2;
      const g = ctx.createLinearGradient(cx - Math.cos(a) * r, cy - Math.sin(a) * r, cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      g.addColorStop(0, l.fill); g.addColorStop(1, l.fill2); fill = g;
    }
    ctx.fillStyle = fill; ctx.strokeStyle = l.stroke.color; ctx.lineWidth = l.stroke.width;
    if (l.shape === "burst") {
      const cx = l.w / 2, cy = l.h / 2, R = Math.hypot(l.w, l.h) / 2, r0 = R * l.inner;
      for (let i = 0; i < l.lines; i++) {
        const a = i / l.lines * Math.PI * 2 + (i % 3) * 0.013, wdt = 0.012 + (i * 37 % 11) / 900;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0 * (0.9 + (i * 17 % 7) / 30), cy + Math.sin(a) * r0 * (0.9 + (i * 13 % 7) / 30));
        ctx.lineTo(cx + Math.cos(a - wdt) * R * 1.1, cy + Math.sin(a - wdt) * R * 1.1); ctx.lineTo(cx + Math.cos(a + wdt) * R * 1.1, cy + Math.sin(a + wdt) * R * 1.1);
        ctx.closePath(); ctx.fill();
      }
    } else {
      if (l.shape === "ellipse") { ctx.beginPath(); ctx.ellipse(l.w / 2, l.h / 2, l.w / 2, l.h / 2, 0, 0, Math.PI * 2); }
      else if (l.shape === "slant") slantPath(ctx, l.w, l.h, l.slant || 0.35);
      else rrect(ctx, 0, 0, l.w, l.h, l.radius);
      ctx.fill(); if (l.stroke.width > 0) ctx.stroke();
    }
  } else if (l.type === "text") {
    const m = textMetrics(ctx, l);
    const pad = (l.box.on ? l.box.pad : 0) + Math.max(0, ...l.strokes.map(s => s.width)) / 2;
    const sx = l.w / (m.w + pad * 2), sy = l.h / (m.h + pad * 2);
    ctx.scale(sx, sy);
    if (l.skew) ctx.transform(1, 0, -Math.tan(l.skew * Math.PI / 180), 1, Math.tan(l.skew * Math.PI / 180) * (m.h / 2 + pad), 0);
    if (l.box.on) {
      ctx.fillStyle = l.box.color;
      m.lines.forEach((t, i) => { const lw = m.ws[i], x0 = l.align === "center" ? (m.w - lw) / 2 : l.align === "right" ? m.w - lw : 0;
        rrect(ctx, x0 + pad - l.box.pad, pad + i * m.lh - l.box.pad * 0.6, lw + l.box.pad * 2, m.lh + l.box.pad * 1.2, l.box.radius); ctx.fill(); });
    }
    ctx.textBaseline = "top"; ctx.lineJoin = "round"; ctx.miterLimit = 2;
    const lines = m.lines.map((t, i) => { const lw = m.ws[i]; return { t, x: pad + (l.align === "center" ? (m.w - lw) / 2 : l.align === "right" ? m.w - lw : 0), y: pad + i * m.lh + (m.lh - l.size) * 0.5 }; });
    if (l.shadow.on) {
      ctx.save(); ctx.fillStyle = l.shadow.color; ctx.strokeStyle = l.shadow.color; ctx.filter = l.shadow.blur ? `blur(${l.shadow.blur}px)` : "none";
      const sw = Math.max(0, ...l.strokes.map(s => s.width));
      for (const ln of lines) { if (sw) { ctx.lineWidth = sw; ctx.strokeText(ln.t, ln.x + l.shadow.dx, ln.y + l.shadow.dy); } ctx.fillText(ln.t, ln.x + l.shadow.dx, ln.y + l.shadow.dy); }

}
function openDesign(i) { cur = i; D = DOCS.designs[i]; sel = null; undoStack = []; redoStack = []; renderAll(); renderLayers(); renderProps(); renderDesigns(); }
function showTab(t) { document.querySelectorAll(".ph .tab").forEach(x => x.classList.toggle("on", x.dataset.tab === t)); $("tab-auto").style.display = t === "auto" ? "" : "none"; $("tab-props").style.display = t === "props" ? "" : "none"; }
document.querySelectorAll(".ph .tab").forEach(b => b.onclick = () => showTab(b.dataset.tab));

/* ---------- 내보내기 ---------- */
$("exportBtn").onclick = async () => {
  if (!D) return;
  const c = document.createElement("canvas"); c.width = W; c.height = H; renderDoc(c.getContext("2d"), D.doc, 1);
  const fmt = $("exFmt").value; let data;
  if (fmt === "png") data = c.toDataURL("image/png");
  else { let q = 0.93; do { data = c.toDataURL("image/jpeg", q); q -= 0.07; } while (data.length * 0.75 > 1.95e6 && q > 0.5); }
  const j = await post("/api/thumb/export", { name: NAME, data, fmt, label: D.name });
  if (j.ok) { toast(`저장했어요 · ${j.file}`); post("/api/open", { which: "out" }); }
};

/* ---------- 키보드 ---------- */
addEventListener("keydown", e => {
  if (e.target.closest("textarea, select, input[type=text], input:not([type])")) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === "d") { e.preventDefault(); dupLayer(); return; }
  if (k === "v") setTool("move"); else if (k === "t") setTool("text"); else if (k === "u") setTool("rect"); else if (k === "b") setTool("brush");
  else if (k === "delete" || k === "backspace") delLayer();
  else if (k === "]") { if (tool === "brush") { brush.size = Math.min(200, brush.size + 6); showBrushProps(); } else moveLayer(1); }
  else if (k === "[") { if (tool === "brush") { brush.size = Math.max(4, brush.size - 6); showBrushProps(); } else moveLayer(-1); }
  else if (k.startsWith("arrow")) {
    const l = selL(); if (!l || l.locked) return; e.preventDefault(); const d = e.shiftKey ? 10 : 1;
    commit(); if (k === "arrowleft") l.x -= d; if (k === "arrowright") l.x += d; if (k === "arrowup") l.y -= d; if (k === "arrowdown") l.y += d; changed(false);
  }
});
document.addEventListener("contextmenu", e => { if (!e.target.closest("textarea, input")) e.preventDefault(); });
$("undo").onclick = undo; $("redo").onclick = redo;
$("back").onclick = () => { clearTimeout(saveTimer); post("/api/thumb/save", { name: NAME, docs: JSON.parse(JSON.stringify(DOCS, (k, v) => k.startsWith("_") ? undefined : v)) }).then(() => location.href = "/"); };
addEventListener("resize", layoutStage);

/* ---------- 시작 ---------- */
(async () => {
  if (!NAME) return;
  $("pname").textContent = niceName(NAME) + " · 썸네일";
  for (const [f, w] of [["BlackHanSans-Regular.ttf", "Black Han Sans"], ["Pretendard-Black.otf", "Pretendard Black"], ["Pretendard-Bold.otf", "Pretendard Bold"], ["DoHyeon-Regular.ttf", "Do Hyeon"]]) {
    try { const ff = new FontFace(w, `url(/fonts/${f})`); await ff.load(); document.fonts.add(ff); } catch (e) {}
  }
  const j = await (await fetch("/api/thumb/open?name=" + encodeURIComponent(NAME))).json();
  DOCS = j.docs; HOOKS = j.hooks || []; KEYWORDS = j.keywords || [];
  if (j.info) INFO = j.info;
  if (!DOCS.designs.length) DOCS.designs.push({ id: nid(), name: "디자인 1", doc: { bg: "#111111", layers: [] } });
  openDesign(0); layoutStage(); renderAuto();
  $("saved").textContent = "저장됨";
  const r = await post("/api/thumb/frames", { name: NAME });
  if (r.ok) { const res = await watchJob(); FRAMES = res || []; } else toast(r.error || "");
  renderStrip(); makeCands();
  if (!DOCS.designs[0].doc.layers.length && FRAMES.length) { addImage(frameSrc(FRAMES[0].t), true); undoStack = []; sel = null; renderProps(); renderAll(); }
  showTab("auto");  // 처음엔 자동 후보부터 보여줌
})();
</script>
</body>
</html>
